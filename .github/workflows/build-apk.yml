
name: Build ShareChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Build APK
        run: |
          apktool b . -o sharechat-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sharechat-unsigned-apk
          path: sharechat-unsigned.apk
          if-no-files-found: error
